<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Κουζίνες - Avramidis Woodlab</title>
    <style>
        :root {
            --brand-orange: #c67116;
            --brand-dark: #1a1a1a;
            --white: #ffffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: var(--brand-dark);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow: hidden; /* Αποτρέπει το κάθετο scroll */
        }

        /* Top Bar με απόλυτη ασφάλεια κατά των επικαλύψεων */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            box-sizing: border-box;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }

        .top-bar h1 {
            color: var(--white);
            font-size: 1.2rem;
            margin: 0;
            font-weight: 300;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: nowrap;
            white-space: nowrap;
        }

        .close-btn {
            color: var(--white);
            text-decoration: none;
            font-size: 0.9rem;
            text-transform: uppercase;
            padding: 8px 16px;
            border: 1px solid var(--white);
            border-radius: 4px;
            transition: all 0.3s;
            white-space: nowrap;
            background-color: rgba(0,0,0,0.3);
            flex-shrink: 0;
        }

        .close-btn:hover {
            background-color: var(--brand-orange);
            border-color: var(--brand-orange);
        }

        /* Slider Container */
        .slider-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .slider-image {
            max-width: 90%;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
            transition: opacity 0.4s ease-in-out;
        }

        /* Βελάκια Πλοήγησης */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.5);
            color: var(--white);
            border: none;
            font-size: 2rem;
            padding: 15px 20px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
            z-index: 5;
        }

        .nav-btn:hover {
            background-color: var(--brand-orange);
        }

        .prev { left: 2%; }
        .next { right: 2%; }

        /* Μετρητής εικόνων (π.χ. 1/6) */
        .counter {
            position: absolute;
            bottom: 20px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.2rem;
            letter-spacing: 2px;
        }

    </style>
</head>
<body>

    <div class="top-bar">
        <h1>AVRAMIDIS WOODLAB | <strong>Κουζίνες</strong></h1>
        <!-- Επειδή ανοίγει σε νέο παράθυρο, το κουμπί μπορεί απλά να κλείνει το tab -->
        <a href="index.html#services" class="close-btn">Πίσω</a>
    </div>

    <div class="slider-container">
        <button class="nav-btn prev" id="prevBtn">&#10094;</button>
        
        <img id="main-slider-img" class="slider-image" src="src/kouzines/k1.jpg" alt="Κουζίνα">
        
        <button class="nav-btn next" id="nextBtn">&#10095;</button>

        <div class="counter" id="image-counter">1 / 7</div>
    </div>

    <script>
        // Array με τα paths των 7 εικόνων
        const images = [
            'src/kouzines/k1.jpg',
            'src/kouzines/k2.jpg',
            'src/kouzines/k3.jpg',
            'src/kouzines/k4.jpg',
            'src/kouzines/k5.jpg',
            'src/kouzines/k6.jpg',
            'src/kouzines/k7.jpg'
        ];

        let currentIndex = 0;
        
        const sliderImg = document.getElementById('main-slider-img');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const counter = document.getElementById('image-counter');

        function updateSlider() {
            // Eφέ fade out/in για πιο επαγγελματική εναλλαγή
            sliderImg.style.opacity = 0.5; 
            
            setTimeout(() => {
                sliderImg.src = images[currentIndex];
                counter.textContent = `${currentIndex + 1} / ${images.length}`;
                sliderImg.style.opacity = 1;
            }, 200);
        }

        // Κουμπί Επόμενο
        nextBtn.addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % images.length;
            updateSlider();
        });

        // Κουμπί Προηγούμενο
        prevBtn.addEventListener('click', () => {
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            updateSlider();
        });

        // Υποστήριξη και για τα βελάκια του πληκτρολογίου
        document.addEventListener('keydown', (event) => {
            if (event.key === 'ArrowRight') {
                nextBtn.click();
            } else if (event.key === 'ArrowLeft') {
                prevBtn.click();
            }
        });
    </script>
</body>
</html>
