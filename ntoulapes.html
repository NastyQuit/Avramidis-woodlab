<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ντουλάπες - Avramidis Woodlab</title>
    <style>
        :root { --brand-orange: #c67116; --brand-dark: #1a1a1a; --white: #ffffff; }
        body, html { margin: 0; padding: 0; height: 100%; background-color: var(--brand-dark); font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; overflow: hidden; }
        .top-bar { position: absolute; top: 0; width: 100%; padding: 1.5rem; display: flex; justify-content: space-between; align-items: center; z-index: 10; box-sizing: border-box; }
        .top-bar h1 { color: var(--white); font-size: 1.5rem; margin: 0; font-weight: 300; letter-spacing: 1px; }
        .close-btn { color: var(--white); text-decoration: none; font-size: 1rem; text-transform: uppercase; padding: 8px 16px; border: 1px solid var(--white); border-radius: 4px; transition: all 0.3s; }
        .close-btn:hover { background-color: var(--brand-orange); border-color: var(--brand-orange); }
        .slider-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .slider-image { max-width: 90%; max-height: 80vh; object-fit: contain; border-radius: 8px; box-shadow: 0 15px 40px rgba(0,0,0,0.5); transition: opacity 0.4s ease-in-out; }
        .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background-color: rgba(0, 0, 0, 0.5); color: var(--white); border: none; font-size: 2rem; padding: 15px 20px; cursor: pointer; border-radius: 5px; transition: background-color 0.3s; z-index: 5; }
        .nav-btn:hover { background-color: var(--brand-orange); }
        .prev { left: 2%; } .next { right: 2%; }
        .counter { position: absolute; bottom: 20px; color: rgba(255, 255, 255, 0.7); font-size: 1.2rem; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div class="top-bar">
        <h1>AVRAMIDIS WOODLAB | <strong>Ντουλάπες</strong></h1>
        <a href="index.html" class="close-btn">&#8592; Επιστροφη</a>
    </div>

    <div class="slider-container">
        <button class="nav-btn prev" id="prevBtn">&#10094;</button>
        <img id="main-slider-img" class="slider-image" src="src/w1.jpg" alt="Ντουλάπα">
        <button class="nav-btn next" id="nextBtn">&#10095;</button>
        <div class="counter" id="image-counter">1 / 4</div>
    </div>

    <script>
        const images = ['src/w1.jpg', 'src/w2.jpg', 'src/w3.jpg', 'src/w4.jpg']; // Πρόσθεσε/αφαίρεσε αρχεία αν χρειάζεται
        let currentIndex = 0;
        const sliderImg = document.getElementById('main-slider-img');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const counter = document.getElementById('image-counter');

        function updateSlider() {
            sliderImg.style.opacity = 0.5; 
            setTimeout(() => {
                sliderImg.src = images[currentIndex];
                counter.textContent = `${currentIndex + 1} / ${images.length}`;
                sliderImg.style.opacity = 1;
            }, 200);
        }

        nextBtn.addEventListener('click', () => { currentIndex = (currentIndex + 1) % images.length; updateSlider(); });
        prevBtn.addEventListener('click', () => { currentIndex = (currentIndex - 1 + images.length) % images.length; updateSlider(); });
        document.addEventListener('keydown', (event) => {
            if (event.key === 'ArrowRight') nextBtn.click();
            else if (event.key === 'ArrowLeft') prevBtn.click();
        });
    </script>
</body>
</html>
